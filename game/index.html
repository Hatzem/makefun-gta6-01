<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Harbor — an open-world getaway</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161c; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #testlog { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset Harbor: an open-world game. Walk and drive with WASD, press E to enter a car."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testlog"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
